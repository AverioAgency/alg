# Staging overrides. Apply with:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# The defining property of staging: it never sends. ALG_SENDING_ENABLED is forced
# to false here and loadEnv() additionally refuses to boot if NODE_ENV=staging is
# combined with sending enabled, so a stray .env cannot override this.

services:
  api:
    environment:
      NODE_ENV: staging
      ALG_SENDING_ENABLED: "false"
      LOG_LEVEL: debug

  worker:
    environment:
      NODE_ENV: staging
      ALG_SENDING_ENABLED: "false"
      LOG_LEVEL: debug

  scraper:
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug
