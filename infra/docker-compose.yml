# ALG single-host stack.
#
# This stack brings NO Traefik of its own. The Averio server already runs one, and
# a second instance would fight it for ports 80/443. The api service instead joins
# the existing proxy network as an external network and is routed purely by labels.
#
# Configure in .env:
#   TRAEFIK_NETWORK   name of the running Traefik's docker network (default: proxy)
#   TRAEFIK_ENTRYPOINT / TRAEFIK_CERTRESOLVER  must match that Traefik's config
#   ALG_DOMAIN        hostname to route (default: alg-nexoro.averio.agency)
# Find the network name with:  docker network ls
#
# Note on Supabase: this project uses a managed self-hosted Supabase at
# db-alg-nexoro.averio.agency as its Postgres. The `postgres` service below is for
# local development and CI only - set DATABASE_URL to the remote instance and it
# goes unused. Supabase is treated as a plain Postgres: no RLS, no anon key in
# circulation, the frontend never connects to it directly.

name: alg

services:
  # One-shot migration job. Run it before starting the stack:
  #   docker compose run --rm migrate
  # Kept as a separate service rather than an api entrypoint step so that two API
  # replicas can never race each other applying the same migration.
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    profiles: ["tools"]
    env_file: ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    working_dir: /app/packages/db
    command: ["node", "dist/migrate.js"]
    networks:
      - internal
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      ALG_STORAGE_PATH: /data/alg/storage
      SCRAPER_URL: http://scraper:4000
    volumes:
      - alg_storage:/data/alg/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - proxy
      - internal
      - scraping
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      # Must name the shared proxy network: the api container sits on three networks
      # and Traefik would otherwise pick the wrong address to route to.
      - traefik.docker.network=${TRAEFIK_NETWORK:-edge}
      - traefik.http.routers.alg-api.rule=Host(`${ALG_DOMAIN:-alg-nexoro.averio.agency}`)
      - traefik.http.routers.alg-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.alg-api.tls=true
      - traefik.http.routers.alg-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.services.alg-api.loadbalancer.server.port=3000

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ALG_STORAGE_PATH: /data/alg/storage
      SCRAPER_URL: http://scraper:4000
    volumes:
      - alg_storage:/data/alg/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
      - scraping

  scraper:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.scraper
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ALG_STORAGE_PATH: /data/alg/storage
    volumes:
      - alg_storage:/data/alg/storage
    # No `ports:` and not on the edge network - the scraper is reachable from api
    # and worker only. It fetches arbitrary third-party URLs, so it must never be
    # able to reach Traefik, Postgres or Redis.
    networks:
      - scraping
    labels:
      - traefik.enable=false

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Local development only. Production points DATABASE_URL at the self-hosted
  # Supabase instance instead.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: alg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alg-local-dev}
      POSTGRES_DB: alg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alg -d alg"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  # Named volume, not a bind mount into a home directory: it must survive a
  # rebuild and be backed up by infra/scripts/backup.sh alongside pg_dump.
  alg_storage:
  redis_data:
  postgres_data:

networks:
  # The Averio server's existing Traefik network. Declared external so this stack
  # joins it instead of creating a competing one - `docker compose up` fails with a
  # clear error if the name is wrong, which is better than silently not routing.
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-edge}
  internal:
  # The scraper's own segment. api and worker join it explicitly when M2 wires up
  # the internal HTTP call; nothing else is reachable from here.
  scraping:
