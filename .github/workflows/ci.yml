name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs with sending disabled. A test that reaches a real SMTP server
  # should fail loudly rather than deliver mail.
  ALG_SENDING_ENABLED: "false"

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26 is the target runtime. 24 LTS runs alongside as a fallback net: if a
        # dependency breaks on 26 we want to know that 24 is still viable for the
        # affected service before we need it.
        node: ["26", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # The root build resolves every project, so it hides a missing tsconfig
      # reference. The Dockerfiles build with --filter, which does not - and that
      # difference has broken an image build before.
      - name: Build the way the Dockerfiles do
        run: |
          rm -rf packages/*/dist packages/adapters/*/dist apps/*/dist
          find . -name '*.tsbuildinfo' -not -path './node_modules/*' -delete
          pnpm --filter @alg/shared --filter @alg/db --filter @alg/core \
               --filter @alg/adapters-discovery --filter @alg/adapters-signals --filter @alg/api build
          pnpm --filter @alg/shared --filter @alg/db --filter @alg/core \
               --filter @alg/adapters-discovery --filter @alg/adapters-signals --filter @alg/worker build
          pnpm --filter @alg/shared --filter @alg/scraper build

      - name: Test
        run: pnpm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build scraper image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.scraper
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          # The proxy network is external on the real host (the server's existing
          # Traefik owns it), so it must exist before compose resolves the file.
          docker network create edge || true
          docker compose -f infra/docker-compose.yml config >/dev/null
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.staging.yml config >/dev/null
